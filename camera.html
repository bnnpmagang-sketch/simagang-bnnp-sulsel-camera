<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#075985">
  <title>Kamera Absensi SIMAGANG</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    main {
      max-width: 560px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 28px #0f172a12;
    }

    h1 {
      font-size: 24px;
      margin-top: 0;
    }

    p {
      color: #475569;
      font-size: 15px;
      line-height: 1.6;
    }

    video,
    #preview {
      display: block;
      width: 100%;
      max-height: 65vh;
      object-fit: cover;
      background: #0f172a;
      border-radius: 12px;
    }

    button {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    .primary {
      background: #0369a1;
      color: white;
    }

    .secondary {
      background: #e2e8f0;
      color: #0f172a;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      overflow-wrap: anywhere;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      main {
        margin: 10px auto;
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<main>

  <h1>Absensi Kamera SIMAGANG</h1>

  <p>
    Izinkan akses kamera, pastikan wajah terlihat jelas,
    lalu ambil foto untuk dikirim kembali ke SIMAGANG.
  </p>

  <video id="video" autoplay playsinline muted></video>

  <img
    id="preview"
    class="hidden"
    alt="Pratinjau foto absensi"
  >

  <canvas id="canvas" class="hidden"></canvas>

  <button id="startBtn" class="primary">
    Aktifkan Kamera
  </button>

  <button id="captureBtn" class="primary hidden">
    Ambil Foto
  </button>

  <button id="retakeBtn" class="secondary hidden">
    Ulangi Foto
  </button>

  <button id="sendBtn" class="primary hidden">
    Gunakan Foto Ini
  </button>

  <p id="status" role="status">
    Kamera belum diaktifkan.
  </p>

</main>

<script>
(function () {
  'use strict';

  // ==========================================
  // 1. MEMBACA PARAMETER SESI
  // ==========================================

  const params = new URLSearchParams(window.location.search);

  const nonce = params.get('nonce') || '';
  const returnOrigin = params.get('returnOrigin') || '';

  // ==========================================
  // 2. MENGAMBIL ELEMEN HTML
  // ==========================================

  const video = document.getElementById('video');
  const preview = document.getElementById('preview');
  const canvas = document.getElementById('canvas');

  const startBtn = document.getElementById('startBtn');
  const captureBtn = document.getElementById('captureBtn');
  const retakeBtn = document.getElementById('retakeBtn');
  const sendBtn = document.getElementById('sendBtn');

  const statusEl = document.getElementById('status');

  // ==========================================
  // 3. VARIABEL KAMERA
  // ==========================================

  let mediaStream = null;
  let photoBase64 = null;
  let isSending = false;

  // ==========================================
  // 4. VALIDASI ORIGIN GOOGLE APPS SCRIPT
  // ==========================================

  function isAllowedParentOrigin(origin) {
    try {
      const parsed = new URL(origin);

      if (parsed.protocol !== 'https:') {
        return false;
      }

      if (parsed.origin !== origin) {
        return false;
      }

      const hostname = parsed.hostname.toLowerCase();

      return (
        hostname === 'script.google.com' ||
        hostname === 'script.googleusercontent.com' ||
        hostname.endsWith('-script.googleusercontent.com') ||
        hostname.endsWith('.script.googleusercontent.com')
      );

    } catch (error) {
      return false;
    }
  }

  // ==========================================
  // 5. MENAMPILKAN STATUS
  // ==========================================

  function showStatus(message) {
    statusEl.textContent = message;
  }

  // ==========================================
  // 6. MENGHENTIKAN KAMERA
  // ==========================================

  function stopCamera() {
    if (mediaStream) {
      mediaStream.getTracks().forEach(function (track) {
        track.stop();
      });

      mediaStream = null;
    }

    video.srcObject = null;
  }

  // ==========================================
  // 7. MENGAKTIFKAN KAMERA
  // ==========================================

  async function startCamera() {
    try {
      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        throw new Error(
          'Browser tidak mendukung akses kamera. Gunakan HTTPS.'
        );
      }

      stopCamera();

      showStatus('Sedang mengaktifkan kamera...');

      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: {
            ideal: 'user'
          },
          width: {
            ideal: 1280
          },
          height: {
            ideal: 720
          }
        }
      });

      video.srcObject = mediaStream;

      await video.play();

      startBtn.classList.add('hidden');
      captureBtn.classList.remove('hidden');

      preview.classList.add('hidden');
      video.classList.remove('hidden');

      retakeBtn.classList.add('hidden');
      sendBtn.classList.add('hidden');

      showStatus(
        'Kamera aktif. Pastikan wajah terlihat jelas.'
      );

    } catch (error) {
      console.error('Camera error:', error);

      let message = error.message || 'Terjadi kesalahan.';

      if (error.name === 'NotAllowedError') {
        message = 'Akses kamera ditolak. Periksa izin kamera browser.';
      }

      if (error.name === 'NotFoundError') {
        message = 'Kamera tidak ditemukan.';
      }

      if (error.name === 'NotReadableError') {
        message = 'Kamera sedang digunakan aplikasi lain.';
      }

      showStatus('Kamera gagal dibuka: ' + message);

      startBtn.classList.remove('hidden');
      captureBtn.classList.add('hidden');
    }
  }

  // ==========================================
  // 8. MENGAMBIL FOTO
  // ==========================================

  function capturePhoto() {
    if (!mediaStream || !video.videoWidth) {
      showStatus('Kamera belum siap. Silakan tunggu.');
      return;
    }

    try {
      const maxWidth = 1280;

      const scale = Math.min(
        1,
        maxWidth / video.videoWidth
      );

      canvas.width = Math.round(
        video.videoWidth * scale
      );

      canvas.height = Math.round(
        video.videoHeight * scale
      );

      const context = canvas.getContext('2d');

      context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const dataUrl = canvas.toDataURL(
        'image/jpeg',
        0.70
      );

      photoBase64 = dataUrl.split(',')[1];

      if (!photoBase64) {
        throw new Error('Foto gagal diproses.');
      }

      preview.src = dataUrl;

      preview.classList.remove('hidden');
      video.classList.add('hidden');

      captureBtn.classList.add('hidden');
      retakeBtn.classList.remove('hidden');
      sendBtn.classList.remove('hidden');

      stopCamera();

      showStatus(
        'Foto berhasil diambil. Periksa sebelum mengirim.'
      );

    } catch (error) {
      console.error('Capture error:', error);

      showStatus(
        'Gagal mengambil foto: ' + error.message
      );
    }
  }

  // ==========================================
  // 9. MENGAMBIL ULANG FOTO
  // ==========================================

  function retakePhoto() {
    photoBase64 = null;
    isSending = false;

    sendBtn.disabled = false;

    preview.removeAttribute('src');

    preview.classList.add('hidden');
    retakeBtn.classList.add('hidden');
    sendBtn.classList.add('hidden');

    startCamera();
  }

  // ==========================================
  // 10. MENGIRIM FOTO KE SIMAGANG
  // ==========================================

  function sendPhoto() {

    if (isSending) {
      return;
    }

    if (!photoBase64) {
      showStatus('Silakan ambil foto terlebih dahulu.');
      return;
    }

    if (!nonce) {
      showStatus(
        'Sesi kamera tidak valid. Buka kamera kembali dari SIMAGANG.'
      );
      return;
    }

    if (!returnOrigin ||
        !isAllowedParentOrigin(returnOrigin)) {

      showStatus(
        'Alamat asal SIMAGANG tidak valid. Silakan buka kamera kembali.'
      );

      console.error('Origin ditolak:', returnOrigin);
      return;
    }

    if (window.parent === window) {
      showStatus('Halaman SIMAGANG tidak ditemukan.');
      return;
    }

    if (photoBase64.length > 3 * 1024 * 1024) {
      showStatus(
        'Ukuran foto terlalu besar. Silakan ambil foto ulang.'
      );
      return;
    }

    try {
      isSending = true;
      sendBtn.disabled = true;

      showStatus(
        'Sedang mengirim foto ke SIMAGANG...'
      );

      // Mengirim foto ke halaman utama.
      // Token login tidak dikirim ke GitHub Pages.

      window.parent.postMessage(
        {
          type: 'SIMAGANG_CAMERA_PHOTO',
          nonce: nonce,
          mimeType: 'image/jpeg',
          base64: photoBase64
        },
        returnOrigin
      );

      showStatus(
        'Foto sudah dikirim. Kembali ke tab SIMAGANG.'
      );

      // Jangan langsung menganggap foto sudah tersimpan.
      // Penyimpanan dilakukan oleh Apps Script.

    } catch (error) {
      console.error('Send photo error:', error);

      isSending = false;
      sendBtn.disabled = false;

      showStatus(
        'Pengiriman foto gagal: ' + error.message
      );
    }
  }

  // ==========================================
  // 11. EVENT TOMBOL
  // ==========================================

  startBtn.addEventListener(
    'click',
    startCamera
  );

  captureBtn.addEventListener(
    'click',
    capturePhoto
  );

  retakeBtn.addEventListener(
    'click',
    retakePhoto
  );

  sendBtn.addEventListener(
    'click',
    sendPhoto
  );

  // ==========================================
  // 12. MEMBERSIHKAN KAMERA
  // ==========================================

  window.addEventListener(
    'pagehide',
    stopCamera
  );

  // ==========================================
  // 13. PEMERIKSAAN AWAL SESI
  // ==========================================

  if (!nonce || !returnOrigin) {
    showStatus(
      'Buka halaman kamera melalui tombol Absensi Kamera di SIMAGANG.'
    );
  }

})();
</script>
</body>
</html>
